version: 2
updates:
  # Python dependencies managed by uv (updates uv.lock as well as pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # a Django range is set by hand and tested in matrix
    ignore:
      - dependency-name: "django"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
