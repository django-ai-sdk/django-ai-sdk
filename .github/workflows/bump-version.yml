name: Bump version strings

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Replace install version in README and site
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -E -i "s@django-ai-sdk==[0-9][^[:space:]<\"]*@django-ai-sdk==$VERSION@g" \
            README.md public/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md public/index.html
          git diff --staged --quiet || git commit -m "chore: bump install version to $VERSION"
          git push origin HEAD:dev
