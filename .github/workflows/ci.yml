name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call: # the release workflow gates publishing on this

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, Django ${{ matrix.django }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        django: ["5.2", "6.0", "6.1"]
        include:
          - os: macos-latest
            python-version: "3.13"
            django: "6.1"
          - os: windows-latest
            python-version: "3.13"
            django: "6.1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Run tests
        run: |
          args="--with django==${{ matrix.django }}.*"

          # fix: django 6.1 removed `cc_delim_re`, need specific drf
          if [ "${{ matrix.django }}" = "6.1" ]; then
            args="$args --with djangorestframework~=3.18.3"
          fi
          make test UV_RUN_ARGS="$args"

      - name: Run demo tests
        if: runner.os == 'Linux'
        run: make test-demos

  postgres:
    name: Test (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/settings.py switches to Postgres when DATABASE_URL is set.
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres
      UV_RUN_ARGS: '--with "psycopg[binary]"'

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      # The race tests in tests/oversight/test_durability.py only run on Postgres.
      - name: Run tests, with a coverage floor for oversight
        run: >-
          make test
          UV_RUN_ARGS="$UV_RUN_ARGS --with pytest-cov"
          PYTEST_ARGS='--cov=django_ai_sdk/oversight --cov-report=term --cov-fail-under=90'

      - name: Run the oversight tests in random order
        run: make test UV_RUN_ARGS="$UV_RUN_ARGS --with pytest-randomly" TEST_PATHS=tests/oversight

      # The switches app is opt-in: core and review must pass without its overlay installed.
      - name: Run the oversight tests without the switches app
        run: >-
          make test
          TEST_PATHS=tests/oversight
          PYTEST_ARGS='--ds=tests.settings_without_switches --ignore=tests/oversight/switches'

      # The ledger and the vault are opt-in: the rest must pass on core's own custody without them.
      - name: Run the oversight tests without the ledger and the vault
        run: >-
          make test
          TEST_PATHS=tests/oversight
          PYTEST_ARGS='--ds=tests.settings_without_ledger --ignore=tests/oversight/ledger'

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uv run ruff check django_ai_sdk/ demos/

      - name: Typecheck
        run: make typecheck

      - name: Migrations match the models
        run: make check-migrations
