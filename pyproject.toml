[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm>=10.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["django_ai_sdk*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[project]
authors = [{name = "terminalkitten"}]
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["django", "ai", "assistant", "rag", "llm", "streaming", "sse"]
dependencies = [
  "aiofiles>=25.1.0",
  "daphne>=4.2.2",
  "django>=6.0.6,<6.1",
  "django-environ>=0.14.0",
  "django-ninja>=1.6.2",
  "django-tasks>=0.12.0",
  "django-tasks-db>=0.12.0",
  "loguru>=0.7.3",
  "puremagic>=2.2.0",
  "pydantic>=2.13.4",
  "tenacity>=9.1.4",
]
description = "Django AI SDK is a library that provides tools and utilities for building AI-powered applications with Django. It includes features such as natural language processing, machine learning, and integration with popular AI frameworks."
name = "django-ai-sdk"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/django-ai-sdk/django-ai-sdk"
Repository = "https://github.com/django-ai-sdk/django-ai-sdk"
Issues = "https://github.com/django-ai-sdk/django-ai-sdk/issues"
Changelog = "https://github.com/django-ai-sdk/django-ai-sdk/releases"

[project.optional-dependencies]
all = ["django-ai-sdk[haystack,restframework,mcp]"]
haystack = [
  "chroma-haystack>=4.3.0",
  "fastembed-haystack>=2.3.0",
  "haystack-ai>=2.30.2",
  "huggingface-hub>=1.21.0",
  "qdrant-haystack>=10.3.0",
  "sentence-transformers>=5.6.0",
]
mcp = ["mcp>=1.28.1", "mcp-haystack>=1.4.0"]
restframework = ["djangorestframework>=3.17.1"]
[dependency-groups]
dev = [
  "django-stubs>=6.0.6",
  "factory-boy>=3.3.3",
  "graphviz>=0.21",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-django>=4.12.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.20",
  "lefthook>=2.1.9",
  "django-watchfiles>=1.4.0",
  "polyfactory>=3.3.0",
  "ty>=0.0.55",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*"]
source = ["django_ai_sdk"]

[tool.ruff]
line-length = 100
exclude = [
  "**/docs/**",
  "**/tests/**",
  "**/conftest.py",
]
src = ["django_ai_sdk", "demo"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "ANN",
  "TCH",
]
ignore = ["ANN401", "E501"]

[tool.ty.src]
include = ["django_ai_sdk", "demo"]
exclude = [
  "docs/**",
  "**/tests/**",
  "**/conftest.py",
  "**/migrations/**",
  "demo/**/settings.py",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/.*",
  ".venv/**",
  "django_ai_sdk/deprecated/**",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff.lint.pydocstyle]
convention = "google"
