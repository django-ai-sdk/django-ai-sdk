[tool.setuptools.packages.find]
where = ["."]
include = ["django_ai_sdk*"]
exclude = ["demo*", "logs*", "ideas*"]

[project]
dependencies = [
  "daphne>=4.2.1",
  "django>=5.2.6",
  "django-environ>=0.12.1",
  "django-ninja>=1.5.3",
  "loguru>=0.7.3",
  "mimetypes-magic>=0.4.30",
  "pydantic>=2.12.5",
]
description = "Django AI SDK is a library that provides tools and utilities for building AI-powered applications with Django. It includes features such as natural language processing, machine learning, and integration with popular AI frameworks."
name = "django-ai-sdk"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
all = ["django-ai-sdk[rag,haystack,openai,mistral,restframework,mcp]"]
haystack = [
  "chroma-haystack>=4.1.1",
  "fastembed-haystack>=2.1.0",
  "haystack-ai>=2.24.1",
  "huggingface-hub>=1.5.0",
  "qdrant-haystack>=10.2.1",
  "sentence-transformers>=5.2.3",
]
mcp = ["mcp>=1.0", "mcp-haystack>=1.3.0"]
mistral = ["mistralai>=1.12.3"]
openai = ["openai>=1.0.0", "openai-agents>=0.10.2"]
rag = ["bm25s>=0.3.0", "nltk>=3.9.3"]
restframework = ["djangorestframework>=3.14.0"]
[dependency-groups]
dev = [
  "django-stubs>=5.2.9",
  "factory-boy>=3.3.0",
  "graphviz>=0.20.0",
  "harlequin>=2.5.1",
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-django>=4.7.0",
  "pytest-mock>=3.12.0",
  "pyright>=1.1.408",
  "ruff>=0.15.4",
  "sqlite-web>=0.7.1",
  "ty>=0.0.20",
  "lefthook>=2.1.3",
  "django-watchfiles>=1.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["django_ai_sdk/tests"]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*"]
source = ["django_ai_sdk"]

[tool.ruff]
line-length = 100
exclude = [
  "**/docs/**",
  "**/tests/**",
  "**/conftest.py",
]
src = ["django_ai_sdk", "demo"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "ANN",
  "TCH",
]
ignore = ["ANN401", "E501"]

[tool.pyright]
exclude = [
  "docs/**",
  "**/tests/**",
  "**/conftest.py",
  "**/migrations/**",
  "demo/**/settings.py",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/.*",
  ".venv/**",
]
include = ["django_ai_sdk", "demo"]
pythonVersion = "3.12"
reportMissingImports = false
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.ruff.lint.pydocstyle]
convention = "google"
