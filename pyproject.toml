[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["django_ai_sdk*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[project]
authors = [{name = "terminalkitten"}]
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["django", "ai-agents", "agentic-framework", "multi-agent", "llm-agents", "workflow-automation", "rag", "llm", "python"]
dependencies = [
  "aiofiles>=25.1.0",
  "cashews>=7.6.0,<9",
  "django>=6.1.1,<6.2",
  "haystack-ai>=3.1.1",
  "django-tasks>=0.12.0",
  "loguru>=0.7.3",
  "puremagic>=2.2.0",
  "pydantic>=2.13.5",
  "tenacity>=9.1.4",
]
description = "Build AI agents in Django. Batteries included."
name = "django-ai-sdk"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/django-ai-sdk/django-ai-sdk"
Repository = "https://github.com/django-ai-sdk/django-ai-sdk"
Issues = "https://github.com/django-ai-sdk/django-ai-sdk/issues"
Changelog = "https://github.com/django-ai-sdk/django-ai-sdk/releases"

[project.optional-dependencies]
all = ["django-ai-sdk[haystack,rag,mcp,files,providers,transformers]"]
providers = ["django-ai-sdk[anthropic,huggingface,mistral,ollama,openrouter]"]
rag = ["django-ai-sdk[chroma,qdrant]"]
# Kept so the documented `django-ai-sdk[haystack]` keeps working; it is a core
# dependency now.
haystack = ["haystack-ai>=3.1.1"]
mcp = ["mcp-haystack>=1.5.1", "authlib>=1.8.0"]
# Files support
files = [
  "firecrawl-anydoc>=0.2.4",
  "openpyxl>=3.1.5",
  "pdf-inspector>=1.21.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
]

# Vector stores
embeddings = ["fastembed-haystack>=2.7.0", "django-ai-sdk[haystack]"]
chroma = ["chroma-haystack>=4.5.0", "django-ai-sdk[embeddings]"]
qdrant = ["qdrant-haystack>=10.6.0", "django-ai-sdk[embeddings]"]
# Model providers, one integration package each.
anthropic = ["anthropic-haystack>=6.0.1"]
huggingface = ["huggingface-api-haystack>=1.0.0"]
mistral = ["mistral-haystack>=2.0.0"]
ollama = ["ollama-haystack>=7.0.0"]
openrouter = ["openrouter-haystack>=1.2.0"]
# Runs a model locally
transformers = ["transformers-haystack>=1.0.0"]

[dependency-groups]
# The demo project stack.
demo = [
  "daphne>=4.2.3",
  "ddgs-haystack>=1.1.0",
  "django-allauth[headless]>=65.19.4",
  "django-cors-headers>=4.9.0",
  "django-environ>=0.14.0",
  "django-ninja>=1.7.1",
  "django-tasks-db>=0.13.0",
  "django-watchfiles>=1.4.0",
  "djangorestframework>=3.18.1",
  "trafilatura>=2.2.0",
]
dev = [
  "django-stubs>=6.1.1",
  "factory-boy>=3.3.3",
  "graphviz>=0.21",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-django>=4.14.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.16.8",
  "lefthook>=2.1.14",
  "polyfactory>=3.3.0",
  "ty>=0.0.82",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*"]
source = ["django_ai_sdk"]

[tool.ruff]
line-length = 100
exclude = [
  "**/docs/**",
  "**/tests/**",
  "**/conftest.py",
]
src = ["django_ai_sdk", "demo"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "ANN",
  "TCH",
]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "ninja.Schema",
    "pydantic.BaseModel",
    "django_ai_sdk.artifacts.schemas.ArtifactModel",
    "django_ai_sdk.artifacts.schemas.ArtifactSchema",
]
runtime-evaluated-decorators = [
    "ninja.Router.get",
    "ninja.Router.post",
    "ninja.Router.put",
    "ninja.Router.patch",
    "ninja.Router.delete",
]

[tool.ty.src]
include = ["django_ai_sdk", "demo"]
exclude = [
  "docs/**",
  "**/tests/**",
  "**/conftest.py",
  "**/migrations/**",
  "demo/**/settings.py",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/.*",
  ".venv/**",
  "django_ai_sdk/deprecated/**",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff.lint.pydocstyle]
convention = "google"
