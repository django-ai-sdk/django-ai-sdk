[tool.setuptools.packages.find]
where = ["."]
include = ["django_ai_sdk*"]
exclude = ["demo*", "logs*", "ideas*"]

[project]
dependencies = [
  "daphne>=4.2.1",
  "django>=6.0.5",
  "django-environ>=0.13.0",
  "django-ninja>=1.6.2",
  "loguru>=0.7.3",
  "mimetypes-magic>=0.4.30",
  "pydantic>=2.13.4",
  "python-magic>=0.4.27",
]
description = "Django AI SDK is a library that provides tools and utilities for building AI-powered applications with Django. It includes features such as natural language processing, machine learning, and integration with popular AI frameworks."
name = "django-ai-sdk"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
all = ["django-ai-sdk[rag,haystack,openai,mistral,restframework,mcp]"]
haystack = [
  "chroma-haystack>=4.3.0",
  "fastembed-haystack>=2.3.0",
  "haystack-ai>=2.29.0",
  "huggingface-hub>=1.17.0",
  "qdrant-haystack>=10.3.0",
  "sentence-transformers>=5.5.1",
]
mcp = ["mcp>=1.27.1", "mcp-haystack>=1.3.0"]
mistral = ["mistralai>=2.4.8"]
openai = ["openai>=2.38.0", "openai-agents>=0.17.4"]
rag = ["bm25s>=0.3.9", "nltk>=3.9.4"]
restframework = ["djangorestframework>=3.17.1"]
[dependency-groups]
dev = [
  "django-stubs>=6.0.5",
  "factory-boy>=3.3.3",
  "graphviz>=0.21",
  "harlequin>=2.5.2",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-django>=4.12.0",
  "pytest-mock>=3.15.1",
  "pyright>=1.1.409",
  "ruff>=0.15.15",
  "sqlite-web>=0.7.2",
  "ty>=0.0.40",
  "lefthook>=2.1.9",
  "django-watchfiles>=1.4.0",
  "polyfactory>=3.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["django_ai_sdk/tests"]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*"]
source = ["django_ai_sdk"]

[tool.ruff]
line-length = 100
exclude = [
  "**/docs/**",
  "**/tests/**",
  "**/conftest.py",
]
src = ["django_ai_sdk", "demo"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "ANN",
  "TCH",
]
ignore = ["ANN401", "E501"]

[tool.pyright]
exclude = [
  "docs/**",
  "**/tests/**",
  "**/conftest.py",
  "**/migrations/**",
  "demo/**/settings.py",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/.*",
  ".venv/**",
]
include = ["django_ai_sdk", "demo"]
pythonVersion = "3.12"
reportMissingImports = false
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.ruff.lint.pydocstyle]
convention = "google"
