# Hugo configuration file
title: Django AI SDK

# The docs deploy to a GitHub Pages project site at
# https://django-ai-sdk.github.io/django-ai-sdk/docs/.
# canonifyURLs + baseURL make root-absolute links (/quickstart, /images/...)
# resolve correctly under the /docs/ subpath locally and under
# /django-ai-sdk/docs/ in production (the workflow overrides baseURL).
baseURL: /docs/
canonifyURLs: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Quick Start
      pageRef: /quickstart
      weight: 1
    - name: Manual
      pageRef: /manual
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/django-ai-sdk/django-ai-sdk/"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false
